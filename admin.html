<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Guest Panel</title>
<style>
  :root { --bg:#f4f4f2; --card:#fff; --ink:#1a1a1a; --muted:#777; --line:#e2e2de; --ok:#2e7d4f; --col:#ebebe7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 14px; font-size:13px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .count { color:var(--muted); font-size:13px; }
  .board { display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
  @media (min-width: 900px) { .board { grid-template-columns:repeat(3, 1fr); } }
  section { background:var(--col); border-radius:16px; padding:12px; min-width:0; }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .title { flex:1; min-width:0; font:inherit; font-size:17px; font-weight:700; border:1px solid transparent; background:transparent; border-radius:8px; padding:4px 6px; color:var(--ink); }
  .title:hover { border-color:var(--line); background:var(--card); }
  .title:focus { outline:none; border-color:var(--ink); background:var(--card); }
  .gcount { color:var(--muted); font-size:12px; margin:0 6px 10px; }
  form { display:flex; gap:6px; margin-bottom:10px; }
  input.name-in { flex:1; min-width:0; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--ink); color:#fff; white-space:nowrap; }
  button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  button.danger { background:var(--card); color:#b3261e; border:1px solid #f0d0cd; }
  button.small { padding:6px 10px; font-size:12px; }
  ul { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
  li.sent { opacity:.6; }
  .row { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .name { font-size:16px; font-weight:600; unicode-bidi:plaintext; min-width:0; overflow-wrap:anywhere; }
  .link { font-size:12px; color:var(--muted); word-break:break-all; direction:ltr; margin:4px 0 10px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .actions button { padding:7px 10px; font-size:13px; }
  .actions select { font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:var(--card); max-width:100%; }
  label.sent-toggle { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
  .empty { text-align:center; color:var(--muted); padding:18px 0; font-size:13px; background:transparent; border:1px dashed #cfcfca; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ok); color:#fff; padding:8px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <h1>Guest Panel</h1>
  <p class="sub">Add guests to a group, then copy or send their personal invitation link. Click a group's name to rename it. Everything is saved in this browser only.</p>

  <div class="top">
    <span class="count" id="count"></span>
    <button class="ghost" id="copy-all" type="button">Copy all links</button>
  </div>

  <div class="board" id="board"></div>
</main>
<div class="toast" id="toast"></div>

<script>
  const SITE = 'https://maher1368.github.io/wedding/';
  const KEY = 'wedding-guests';
  const GROUPS_KEY = 'wedding-groups';
  const DEFAULT_GROUPS = ['خانواده داماد', 'خانواده عروس', 'دوستان'];
  const $ = id => document.getElementById(id);

  let guests = [], groups = DEFAULT_GROUPS.slice();
  try { guests = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  try {
    const g = JSON.parse(localStorage.getItem(GROUPS_KEY));
    if (Array.isArray(g) && g.length === 3) groups = g;
  } catch (e) {}
  // Guests added before groups existed go into the first group.
  guests.forEach(g => { if (![0, 1, 2].includes(g.group)) g.group = 0; });

  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify(guests));
      localStorage.setItem(GROUPS_KEY, JSON.stringify(groups));
    } catch (e) {}
  };
  const clean = s => s.normalize('NFC').replace(/\s+/g, ' ').trim();
  const linkFor = name => SITE + '?to=' + encodeURIComponent(name);
  const groupName = i => groups[i] || ('Group ' + (i + 1));

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1400);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Copied');
  }

  const linksText = list => list.map(g => g.name + '\n' + linkFor(g.name)).join('\n\n');

  function guestItem(g) {
    const url = linkFor(g.name);
    const li = document.createElement('li');
    if (g.sent) li.className = 'sent';
    li.innerHTML = `
      <div class="row">
        <div class="name" dir="auto"></div>
        <label class="sent-toggle"><input type="checkbox" ${g.sent ? 'checked' : ''}> Sent</label>
      </div>
      <div class="link"></div>
      <div class="actions">
        <button data-a="copy">Copy link</button>
        <button class="ghost" data-a="wa">WhatsApp</button>
        <button class="ghost" data-a="tg">Telegram</button>
        <button class="ghost" data-a="open">Preview</button>
        <select dir="auto" title="Move to group"></select>
        <button class="danger" data-a="del">Delete</button>
      </div>`;
    li.querySelector('.name').textContent = g.name;
    li.querySelector('.link').textContent = decodeURI(url);
    const sel = li.querySelector('select');
    groups.forEach((_, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = 'Move to: ' + groupName(i);
      if (i === g.group) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { g.group = +sel.value; save(); render(); };
    li.querySelector('input').onchange = e => { g.sent = e.target.checked; save(); render(); };
    li.querySelector('.actions').onclick = e => {
      const a = e.target.dataset.a;
      if (a === 'copy') copy(url);
      if (a === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(url), '_blank');
      if (a === 'tg') window.open('https://t.me/share/url?url=' + encodeURIComponent(url), '_blank');
      if (a === 'open') window.open(url, '_blank');
      if (a === 'del' && confirm('Delete ' + g.name + '?')) {
        guests.splice(guests.indexOf(g), 1); save(); render();
      }
    };
    return li;
  }

  function column(gi) {
    const members = guests.filter(g => g.group === gi);
    const sec = document.createElement('section');
    sec.innerHTML = `
      <div class="head">
        <input class="title" dir="auto" maxlength="40" title="Click to rename">
        <button class="ghost small" type="button" data-a="copy-group">Copy links</button>
      </div>
      <div class="gcount"></div>
      <form><input class="name-in" dir="auto" placeholder="Guest name" autocomplete="off" required><button type="submit">Add</button></form>
      <ul></ul>`;
    const title = sec.querySelector('.title');
    title.value = groupName(gi);
    title.onchange = () => {
      groups[gi] = clean(title.value) || DEFAULT_GROUPS[gi];
      save(); render(); toast('Renamed');
    };
    title.onkeydown = e => { if (e.key === 'Enter') title.blur(); };
    sec.querySelector('.gcount').textContent =
      members.length + ' guests · ' + members.filter(g => g.sent).length + ' sent';
    sec.querySelector('[data-a="copy-group"]').onclick = () => {
      if (members.length) copy(linksText(members));
    };
    const input = sec.querySelector('.name-in');
    sec.querySelector('form').onsubmit = e => {
      e.preventDefault();
      const name = clean(input.value);
      if (!name) return;
      const existing = guests.find(g => g.name === name);
      if (existing) { toast('Already in ' + groupName(existing.group)); return; }
      guests.unshift({ name, sent: false, group: gi });
      save(); render();
      $('board').querySelectorAll('.name-in')[gi].focus();
    };
    const ul = sec.querySelector('ul');
    if (!members.length) ul.innerHTML = '<li class="empty">No guests yet.</li>';
    members.forEach(g => ul.appendChild(guestItem(g)));
    return sec;
  }

  function render() {
    const sent = guests.filter(g => g.sent).length;
    $('count').textContent = guests.length + ' guests in total · ' + sent + ' sent';
    const board = $('board');
    board.innerHTML = '';
    for (let i = 0; i < 3; i++) board.appendChild(column(i));
  }

  $('copy-all').onclick = () => {
    if (!guests.length) return;
    copy([0, 1, 2]
      .map(i => [i, guests.filter(g => g.group === i)])
      .filter(([, list]) => list.length)
      .map(([i, list]) => '— ' + groupName(i) + ' —\n\n' + linksText(list))
      .join('\n\n'));
  };

  render();
</script>
</body>
</html>
