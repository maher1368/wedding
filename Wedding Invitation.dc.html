<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#9b9b9b"></rect><rect x="30" y="38" width="40" height="26" rx="2" fill="none" stroke="#fff" stroke-width="3"></rect><path d="M30 40 L50 54 L70 40" fill="none" stroke="#fff" stroke-width="3"></path></svg></template>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;padding:0;background:#9b9b9b;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:#fff}a:hover{color:#eee}
@font-face{font-family:'Azar';src:url('uploads/Azar.ttf') format('truetype');font-display:swap}
@keyframes tapPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.15);opacity:.7}}
@keyframes ringPulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
</style>
</helmet>
<div dir="rtl" style="position:fixed;inset:0;background:#9b9b9b;overflow:hidden;font-family:Azar, Tahoma, sans-serif">
  <audio ref="{{ audioRef }}" src="uploads/music.mp3" preload="auto" loop="{{ true }}"></audio>
  <div onClick="{{ open }}" style="position:absolute;inset:0;cursor:pointer">
    <video ref="{{ videoRef }}" src="uploads/card2.mp4#t=0.001" muted="{{ true }}" playsInline="{{ true }}" preload="auto" onEnded="{{ showCard }}" onError="{{ showCard }}" style="width:100%;height:100%;object-fit:cover;display:block;background:#9b9b9b"></video>
    <div id="guest-wrap" style="position:absolute;left:0;right:0;top:61%;display:flex;justify-content:center;padding:0 24px;pointer-events:none;opacity:{{ nameOpacity }};transition:opacity .8s ease">
      <div id="guest-name" dir="rtl" style="font-family:Azar, Tahoma, sans-serif;font-size:26px;line-height:1.4;color:#1a1a1a;text-align:center;text-wrap:balance;max-width:100%;overflow-wrap:break-word;unicode-bidi:plaintext;font-feature-settings:'kern' 1">مهمان گرامی</div>
    </div>
    <sc-if value="{{ isIdle }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none">{{ tapIcon }}</div>
    </sc-if>
  </div>
  <div style="position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#9b9b9b;transform:{{ cardTransform }};transition:transform 1.1s cubic-bezier(.22,1,.36,1);pointer-events:{{ cardPointer }}">
    <div style="max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center">
      <img src="uploads/02Artboard-3-copy-6-0620eca9.png" alt="کارت دعوت" style="width:100%;height:auto;display:block">
      <div style="width:100%;display:flex;justify-content:center;padding:28px 20px calc(36px + env(safe-area-inset-bottom));box-sizing:border-box">
        <a href="https://maps.app.goo.gl/8skM7YPaKcJ3bTpB8" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:#1a1a1a;color:#fff;text-decoration:none;font-size:16px;font-weight:600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span>مسیریابی تا باغ تالار شاهدخت</span>
        </a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { phase: 'idle' };
  videoRef = React.createRef();
  audioRef = React.createRef();
  componentDidMount() {
    const el = document.getElementById('guest-name');
    if (!el) return;
    const to = (new URLSearchParams(window.location.search).get('to') || '').normalize('NFC').replace(/\s+/g, ' ').trim();
    if (to) el.textContent = to;
    const wrap = document.getElementById('guest-wrap');
    this.fitName = () => {
      if (wrap) {
        const W = window.innerWidth, H = window.innerHeight, k = Math.max(W / 368, H / 800);
        wrap.style.top = Math.round(H / 2 + k * 118) + 'px';
      }
      el.style.fontSize = '26px';
      const lh = () => parseFloat(getComputedStyle(el).lineHeight) || 1.4 * parseFloat(el.style.fontSize);
      let size = 26;
      while (size > 14 && el.scrollHeight > lh() * 2 + 2) { size -= 2; el.style.fontSize = size + 'px'; }
    };
    this.fitName();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.fitName);
    window.addEventListener('resize', this.fitName);
  }
  componentWillUnmount() { if (this.fitName) window.removeEventListener('resize', this.fitName); }
  open = () => {
    if (this.state.phase !== 'idle') return;
    const a = this.audioRef.current;
    if (a) { const ap = a.play(); if (ap && ap.catch) ap.catch(() => {}); }
    const v = this.videoRef.current;
    this.setState({ phase: 'playing' });
    if (!v) return this.showCard();
    v.muted = true;
    const p = v.play();
    if (p && p.catch) p.catch(() => this.showCard());
  };
  showCard = () => this.setState({ phase: 'card' });
  renderVals() {
    const h = React.createElement;
    const tapIcon = h('div', { style: { position: 'relative', width: 64, height: 64, display: 'flex', alignItems: 'center', justifyContent: 'center' } },
      h('div', { style: { position: 'absolute', inset: 0, borderRadius: '50%', border: '2px solid rgba(255,255,255,.9)', animation: 'ringPulse 1.8s ease-out infinite' } }),
      h('div', { style: { width: 56, height: 56, borderRadius: '50%', background: 'rgba(26,26,26,.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'tapPulse 1.8s ease-in-out infinite' } },
        h('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'none', stroke: '#fff', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' },
          h('path', { d: 'M9 11V5.5a1.5 1.5 0 0 1 3 0V11' }),
          h('path', { d: 'M12 10.5V9.5a1.5 1.5 0 0 1 3 0v2' }),
          h('path', { d: 'M15 11a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 15.5a1.5 1.5 0 0 1 2.3-1.9L9 15.5' }))));
    const isCard = this.state.phase === 'card';
    return {
      videoRef: this.videoRef,
      audioRef: this.audioRef,
      nameOpacity: this.state.phase === 'idle' ? 1 : 0,
      open: this.open,
      showCard: this.showCard,
      isIdle: this.state.phase === 'idle',
      tapIcon,
      cardTransform: isCard ? 'translateY(0)' : 'translateY(100%)',
      cardPointer: isCard ? 'auto' : 'none'
    };
  }
}
</script>
</body>
</html>
