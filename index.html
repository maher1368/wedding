<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوت عروسی نگین و محمد</title>
<meta name="theme-color" content="#9b9b9b">
<link rel="preload" href="assets/Azar.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:'Azar';src:url('assets/Azar.ttf') format('truetype');font-display:swap}
html,body{margin:0;padding:0;background:#9b9b9b;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tapPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.15);opacity:.7}}
@keyframes ringPulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:#9b9b9b;overflow:hidden;font-family:Azar,Tahoma,sans-serif">
  <audio id="music" src="assets/music.mp3" preload="metadata" loop></audio>
  <div id="stage" style="position:absolute;inset:0;cursor:pointer">
    <video id="vid" src="assets/card2.mp4#t=0.001" fetchpriority="high" muted playsinline webkit-playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;display:block;background:#9b9b9b"></video>
    <div id="guest-wrap" style="position:absolute;left:0;right:0;top:61%;display:flex;justify-content:center;padding:0 24px;pointer-events:none;transition:opacity .8s ease">
      <div id="guest-name" dir="rtl" style="font-family:Azar,Tahoma,sans-serif;font-size:26px;line-height:1.4;color:#5e5e5e;text-align:center;text-wrap:balance;max-width:100%;overflow-wrap:break-word;unicode-bidi:plaintext">مهمان گرامی</div>
    </div>
    <div id="tap" style="position:absolute;left:0;right:0;bottom:calc(14vh + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none">
      <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:ringPulse 1.8s ease-out infinite"></div>
        <div style="width:56px;height:56px;border-radius:50%;background:rgba(26,26,26,.55);display:flex;align-items:center;justify-content:center;animation:tapPulse 1.8s ease-in-out infinite">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"></path><path d="M12 10.5V9.5a1.5 1.5 0 0 1 3 0v2"></path><path d="M15 11a1.5 1.5 0 0 1 3 0v3.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 15.5a1.5 1.5 0 0 1 2.3-1.9L9 15.5"></path></svg>
        </div>
      </div>
    </div>
  </div>
  <div id="card" style="position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#9b9b9b;transform:translateY(100%);transition:transform 1.1s cubic-bezier(.22,1,.36,1);pointer-events:none">
    <div style="max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center">
      <picture style="width:100%;display:block"><source srcset="assets/card.webp" type="image/webp"><img src="assets/card.jpg" alt="کارت دعوت" width="1560" height="8318" decoding="async" fetchpriority="low" style="width:100%;height:auto;display:block"></picture>
      <div style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 20px calc(36px + env(safe-area-inset-bottom))">
        <p style="margin:0;font-family:Azar,Tahoma,sans-serif;font-size:16px;line-height:1.7;color:#1a1a1a;text-align:center;text-wrap:balance">جهت مسیریابی از طریق اپلیکیشن‌های مسیریاب کلیک کنید:</p>
        <a href="https://balad.ir/p/70s2GB1fHKiJhq" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:#1a1a1a;color:#fff;text-decoration:none;font-size:16px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span>مسیریابی تا باغ تالار شاهدخت</span>
        </a>
      </div>
    </div>
  </div>
  <div id="loader" style="position:absolute;inset:0;background:#9b9b9b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease;z-index:10">
    <div style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .9s linear infinite"></div>
    <div style="font-family:Azar,Tahoma,sans-serif;font-size:16px;color:#fff">در حال بارگذاری…</div>
  </div>
</div>
<script>
(function(){
  var vid = document.getElementById('vid'), music = document.getElementById('music'),
      stage = document.getElementById('stage'), card = document.getElementById('card'),
      loader = document.getElementById('loader'), tap = document.getElementById('tap'),
      wrap = document.getElementById('guest-wrap'), el = document.getElementById('guest-name');
  var phase = 'idle', ready = false;

  var to = '';
  try { to = (new URLSearchParams(window.location.search).get('to') || ''); } catch (e) {}
  to = (to.normalize ? to.normalize('NFC') : to).replace(/\s+/g, ' ').trim();
  if (to) el.textContent = to;

  function fit() {
    var W = window.innerWidth, H = window.innerHeight, k = Math.max(W / 368, H / 800);
    wrap.style.top = Math.round(H / 2 + k * 118) + 'px';
    var size = 26; el.style.fontSize = size + 'px';
    var lh = function(){ return parseFloat(getComputedStyle(el).lineHeight) || 1.4 * size; };
    while (size > 14 && el.scrollHeight > lh() * 2 + 2) { size -= 2; el.style.fontSize = size + 'px'; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('resize', fit);

  function markReady() {
    if (ready) return; ready = true;
    loader.style.opacity = '0'; loader.style.pointerEvents = 'none';
  }
  vid.addEventListener('loadeddata', markReady);
  vid.addEventListener('canplay', markReady);
  if (vid.readyState >= 2) markReady();
  setTimeout(markReady, 8000);

  function showCard() {
    if (phase === 'card') return; phase = 'card';
    card.style.transform = 'translateY(0)'; card.style.pointerEvents = 'auto';
  }
  vid.addEventListener('ended', showCard);
  vid.addEventListener('error', function(){ if (phase !== 'idle') showCard(); });

  var wasPlaying = false;
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) {
      wasPlaying = !music.paused;
      if (wasPlaying) music.pause();
    } else if (wasPlaying) {
      var rp = music.play(); if (rp && rp.catch) rp.catch(function(){});
      wasPlaying = false;
    }
  });
  window.addEventListener('pagehide', function(){ if (!music.paused) { wasPlaying = true; music.pause(); } });

  stage.addEventListener('click', function(){
    if (phase !== 'idle') return; phase = 'playing';
    wrap.style.opacity = '0'; tap.style.display = 'none';
    try { var ap = music.play(); if (ap && ap.catch) ap.catch(function(){}); } catch (e) {}
    vid.muted = true;
    try {
      var p = vid.play();
      if (p && p.catch) p.catch(showCard);
    } catch (e) { showCard(); }
    setTimeout(showCard, 12000);
  });
})();
</script>
</body>
</html>
